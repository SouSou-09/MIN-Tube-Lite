<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ページが見つかりません - MIN-Tube-Lite</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            min-height: 100vh;
            background: #0f0f0f;
            color: #f1f1f1;
            font-family: "Roboto", "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .wrap {
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        .code {
            font-size: 84px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #3ea6ff;
            line-height: 1;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        p {
            font-size: 14px;
            color: #aaa;
            line-height: 1.7;
            margin-bottom: 24px;
        }
        .btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        a.btn {
            display: inline-block;
            padding: 10px 22px;
            border-radius: 22px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s, transform 0.1s;
        }
        a.btn.primary {
            background: #3ea6ff;
            color: #0f0f0f;
        }
        a.btn.primary:hover { background: #65b8ff; }
        a.btn.secondary {
            background: transparent;
            color: #f1f1f1;
            border: 1px solid #303030;
        }
        a.btn.secondary:hover { background: #1f1f1f; }
        a.btn:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="code">404</div>
        <h1>ページが見つかりません</h1>
        <p>お探しのページは削除されたか、URLが変更された可能性があります。</p>
        <div class="btns">
            <a class="btn primary" href="/">ホームに戻る</a>
            <a class="btn secondary" href="javascript:history.back()">前のページへ</a>
        </div>
    </div>
</body>
</html>

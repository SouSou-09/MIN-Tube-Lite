<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>チャンネル - YouTube Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script>(function(){try{if(localStorage.getItem('theme')!=='dark'){document.documentElement.classList.add('light-mode');}}catch(e){}})();</script>
<style>
:root{--bg:#0f0f0f;--text:#f1f1f1;--sub:#aaa;--chip:rgba(255,255,255,.1);--chip-h:rgba(255,255,255,.2);--line:rgba(255,255,255,.2);--link:#3ea6ff;--skel:#272727;--btn:#f1f1f1;--btn-t:#0f0f0f;--menu:#282828}
html.light-mode{--bg:#fff;--text:#0f0f0f;--sub:#606060;--chip:rgba(0,0,0,.05);--chip-h:rgba(0,0,0,.1);--line:rgba(0,0,0,.2);--link:#065fd4;--skel:#e8e8e8;--btn:#0f0f0f;--btn-t:#fff;--menu:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,"Noto Sans JP","Hiragino Kaku Gothic ProN",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
/* header */
.hdr{position:fixed;top:0;left:0;right:0;height:56px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100}
.logo{display:flex;align-items:center;gap:4px;font-weight:700;font-size:20px;letter-spacing:-1px}
.logo i{color:#f00;font-size:26px}
.sform{display:flex;flex:0 1 640px;height:40px;border:1px solid var(--line);border-radius:40px;overflow:hidden;margin:0 16px}
.sform:focus-within{border-color:#1c62b9}
.sform input{flex:1;background:transparent;border:0;outline:0;color:var(--text);padding:0 16px;font-size:16px;min-width:0}
.sform button{width:64px;border:0;border-left:1px solid var(--line);background:var(--chip);color:var(--text);cursor:pointer;font-size:16px}
.hdr-r{width:100px;display:flex;justify-content:flex-end}
.hdr-r button{background:none;border:0;color:var(--text);font-size:18px;cursor:pointer;width:40px;height:40px;border-radius:50%}
.hdr-r button:hover{background:var(--chip)}
/* page */
.page{max-width:1284px;margin:0 auto;padding:56px 24px 60px}
.banner{margin-top:16px;width:100%;aspect-ratio:6.2/1;border-radius:16px;overflow:hidden;background:var(--skel)}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner.empty{background:linear-gradient(135deg,#3a3a3a,#1a1a1a)}
html.light-mode .banner.empty{background:linear-gradient(135deg,#d7dbe0,#eef0f3)}
.head{display:flex;gap:24px;margin:16px 0 0;align-items:flex-start}
.avatar{width:160px;height:160px;border-radius:50%;flex-shrink:0;background:var(--skel);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.hinfo{min-width:0;flex:1}
.cname{font-size:36px;line-height:50px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px;word-break:break-word}
.cname .vb{font-size:16px;color:var(--sub)}
.cmeta{font-size:14px;line-height:20px;color:var(--sub);margin-top:4px}
.cmeta b{color:var(--text);font-weight:500}
.cdesc{margin-top:12px;font-size:14px;line-height:20px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;max-width:720px}
.cdesc:hover{color:var(--text)}
.cdesc .more{color:var(--text);font-weight:500}
.actions{display:flex;gap:8px;margin-top:16px;align-items:center}
.btn{height:36px;padding:0 16px;border-radius:18px;border:0;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn-sub{background:var(--btn);color:var(--btn-t)}
.btn-sub:hover{opacity:.88}
.btn-sub.on{background:var(--chip);color:var(--text)}
.btn-sub.on:hover{background:var(--chip-h)}
.btn-bell{background:var(--chip);color:var(--text);width:36px;padding:0;justify-content:center;display:none}
.btn-bell.show{display:inline-flex}
.btn-bell.on{background:var(--btn);color:var(--btn-t)}
/* tabs */
.tabs{display:flex;gap:8px;margin-top:20px;border-bottom:1px solid var(--line);position:sticky;top:56px;background:var(--bg);z-index:50;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:0 16px;height:48px;background:none;border:0;border-bottom:2px solid transparent;color:var(--sub);font-size:16px;font-weight:500;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--text)}
/* chips */
.chips{display:flex;gap:12px;margin:16px 0 8px}
.chip{height:32px;padding:0 12px;border-radius:8px;border:0;background:var(--chip);color:var(--text);font-size:14px;font-weight:500;cursor:pointer}
.chip:hover{background:var(--chip-h)}
.chip.active{background:var(--btn);color:var(--btn-t)}
/* grids */
.grid{display:grid;gap:24px 16px;margin-top:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.vcard{display:block;min-width:0}
.vthumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--skel)}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.vcard:hover .vthumb{border-radius:0}
.dur{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:500;padding:1px 4px;border-radius:4px;line-height:14px}
.dur.live{background:#cc0000}
.vtitle{margin-top:12px;font-size:16px;line-height:22px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.vmeta{margin-top:4px;font-size:14px;line-height:20px;color:var(--sub)}
.grid.shorts{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.grid.shorts .vthumb{aspect-ratio:9/16;border-radius:12px}
.grid.shorts .vtitle{font-size:14px;line-height:20px;margin-top:8px}
.pl-badge{position:absolute;right:0;bottom:0;top:0;width:36%;background:rgba(0,0,0,.75);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;gap:6px}
.pl-badge i{font-size:18px}
.empty,.loading{text-align:center;color:var(--sub);padding:48px 0;font-size:14px}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--chip-h);border-top-color:var(--link);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
/* about dialog */
.dlg-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:300;padding:16px}
.dlg-bg.open{display:flex}
.dlg{background:var(--menu);color:var(--text);border-radius:16px;width:100%;max-width:600px;max-height:80vh;overflow:auto;padding:24px;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.dlg h2{margin:0 0 16px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.dlg h2 button{background:none;border:0;color:var(--text);font-size:18px;cursor:pointer;width:36px;height:36px;border-radius:50%}
.dlg h2 button:hover{background:var(--chip)}
.dlg pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:14px;line-height:20px;margin:0 0 16px}
.dlg .row{font-size:14px;line-height:28px;color:var(--sub)}
.dlg .row b{color:var(--text);font-weight:500}
@media(max-width:900px){.avatar{width:96px;height:96px}.cname{font-size:24px;line-height:32px}.page{padding:56px 12px 40px}.banner{aspect-ratio:3.2/1;border-radius:12px}.hdr-r,.logo span{display:none}}
@media(max-width:560px){.head{flex-direction:column;gap:12px}.grid{grid-template-columns:1fr}.grid.shorts{grid-template-columns:repeat(2,1fr)}.sform{margin:0 8px}}
</style>
</head>
<body>
<header class="hdr">
  <a href="/" class="logo"><i class="fab fa-youtube"></i><span>YouTube Pro</span></a>
  <form class="sform" action="/" method="get"><input type="text" name="q" placeholder="検索" autocomplete="off"><button type="submit" aria-label="検索"><i class="fas fa-search"></i></button></form>
  <div class="hdr-r"><button id="themeBtn" title="テーマ切替"><i class="fas fa-circle-half-stroke"></i></button></div>
</header>

<main class="page">
  <div class="banner empty" id="banner"></div>
  <section class="head">
    <div class="avatar"><img id="avatar" alt="" referrerpolicy="no-referrer"></div>
    <div class="hinfo">
      <h1 class="cname"><span id="cname">&nbsp;</span><i class="fas fa-check-circle vb" id="vb" style="display:none" title="認証済み"></i></h1>
      <div class="cmeta" id="cmeta"></div>
      <div class="cdesc" id="cdesc" onclick="openAbout()"></div>
      <div class="actions">
        <button class="btn btn-sub" id="subBtn" onclick="toggleSub()">チャンネル登録</button>
        <button class="btn btn-bell" id="bellBtn" onclick="toggleBell()" title="通知"><i class="far fa-bell"></i></button>
      </div>
    </div>
  </section>

  <nav class="tabs" id="tabs"></nav>
  <div class="chips" id="chips" style="display:none"></div>
  <div class="grid" id="grid"></div>
  <div class="loading" id="loading"><span class="spin"></span>読み込み中...</div>
  <div id="sentinel" style="height:1px"></div>
</main>

<div class="dlg-bg" id="dlgBg" onclick="if(event.target===this)closeAbout()">
  <div class="dlg" role="dialog" aria-modal="true">
    <h2><span>概要</span><button onclick="closeAbout()" aria-label="閉じる"><i class="fas fa-times"></i></button></h2>
    <pre id="aboutText"></pre>
    <div class="row" id="aboutRows"></div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var PARAM = decodeURIComponent(location.pathname.replace(/^\/channel\//, '').replace(/\/$/, ''));
  var ID_RE = /^UC[\w-]{22}$/;
  var q = ID_RE.test(PARAM) ? 'id=' + encodeURIComponent(PARAM) : 'name=' + encodeURIComponent(PARAM);
  var info = null, chId = '', kind = 'videos', cont = '', loading = false, ended = false, gen = 0, sortToken = '';
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

  /* theme */
  $('themeBtn').onclick = function(){
    var light = document.documentElement.classList.toggle('light-mode');
    try { localStorage.setItem('theme', light ? 'light' : 'dark'); } catch(e){}
  };
  document.querySelector('.sform').addEventListener('submit', function(e){
    var v = this.q.value.trim(); if (!v) { e.preventDefault(); return; }
    try {
      var h = JSON.parse(localStorage.getItem('mt_search_history') || '[]').filter(function(x){ return x !== v; });
      h.unshift(v); localStorage.setItem('mt_search_history', JSON.stringify(h.slice(0, 30)));
    } catch(e){}
  });

  /* subscribe (トップページ/動画ページと同じ localStorage 形式: 登録キーはチャンネル名) */
  function subKey(){ return 'subscribed_' + (info ? info.title : PARAM); }
  function notifyKey(){ return 'notify_' + (info ? info.title : PARAM); }
  function renderSub(){
    var on = localStorage.getItem(subKey()) === 'true';
    var b = $('subBtn'); b.textContent = on ? '登録済み' : 'チャンネル登録'; b.classList.toggle('on', on);
    var bell = $('bellBtn'); bell.classList.toggle('show', on);
    var nOn = localStorage.getItem(notifyKey()) === 'true';
    bell.classList.toggle('on', nOn);
    bell.innerHTML = nOn ? '<i class="fas fa-bell"></i>' : '<i class="far fa-bell"></i>';
    bell.title = nOn ? '通知をオフにする' : '通知を受け取る';
  }
  window.toggleSub = function(){
    var k = subKey();
    if (localStorage.getItem(k) === 'true') { localStorage.removeItem(k); localStorage.removeItem(notifyKey()); }
    else {
      localStorage.setItem(k, 'true');
      try { localStorage.setItem('subinfo_' + info.title, JSON.stringify({ name: info.title, avatar: info.avatar || '', channelId: chId, subscribedAt: Date.now() })); } catch(e){}
    }
    renderSub();
  };
  window.toggleBell = async function(){
    var k = notifyKey();
    if (localStorage.getItem(k) === 'true') localStorage.removeItem(k);
    else {
      if ('Notification' in window && Notification.permission === 'default') { try { await Notification.requestPermission(); } catch(e){} }
      localStorage.setItem(k, 'true');
    }
    renderSub();
  };

  /* about dialog */
  window.openAbout = function(){
    if (!info) return;
    $('aboutText').textContent = info.fullDescription || info.description || '説明はありません';
    var rows = [];
    if (info.handle) rows.push('<b>' + esc(info.handle) + '</b>');
    if (info.subscriberText) rows.push('登録者数 <b>' + esc(info.subscriberText) + '</b>');
    if (info.videoCountText) rows.push('<b>' + esc(info.videoCountText) + '</b>');
    $('aboutRows').innerHTML = rows.join('<br>');
    $('dlgBg').classList.add('open');
  };
  window.closeAbout = function(){ $('dlgBg').classList.remove('open'); };
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeAbout(); });

  /* cards */
  function videoCard(v){
    var live = v.isLive;
    return '<a class="vcard" href="/video/' + esc(v.id) + '"><div class="vthumb"><img loading="lazy" src="https://i.ytimg.com/vi/' + esc(v.id) + '/mqdefault.jpg" alt="">' +
      (live ? '<span class="dur live">ライブ</span>' : (v.lengthText ? '<span class="dur">' + esc(v.lengthText) + '</span>' : '')) + '</div>' +
      '<div class="vtitle">' + esc(v.title) + '</div>' +
      '<div class="vmeta">' + [v.viewCountText, v.publishedTimeText].filter(Boolean).map(esc).join(' • ') + '</div></a>';
  }
  function shortCard(v){
    return '<a class="vcard" href="/video/' + esc(v.id) + '"><div class="vthumb"><img loading="lazy" src="https://i.ytimg.com/vi/' + esc(v.id) + '/oar2.jpg" onerror="this.onerror=null;this.src=\'https://i.ytimg.com/vi/' + esc(v.id) + '/hq720.jpg\'" alt=""></div>' +
      '<div class="vtitle">' + esc(v.title) + '</div><div class="vmeta">' + esc(v.viewCountText || '') + '</div></a>';
  }
  function plCard(p){
    var th = p.thumbnail && p.thumbnail.thumbnails && p.thumbnail.thumbnails[0] && p.thumbnail.thumbnails[0].url || '';
    return '<a class="vcard" href="/playlist?list=' + esc(p.id) + '"><div class="vthumb">' + (th ? '<img loading="lazy" src="' + esc(th) + '" alt="">' : '') +
      '<div class="pl-badge"><i class="fas fa-list"></i>' + (p.videoCount ? esc(p.videoCount) + ' 本' : '') + '</div></div>' +
      '<div class="vtitle">' + esc(p.title) + '</div><div class="vmeta">再生リスト</div></a>';
  }

  /* tab content */
  function setLoading(on, msg){
    var l = $('loading'); l.style.display = on || msg ? 'block' : 'none';
    l.innerHTML = on ? '<span class="spin"></span>読み込み中...' : (msg || '');
  }
  async function loadMore(){
    if (loading || ended || !chId) return;
    loading = true; var my = gen;
    setLoading(true);
    try {
      var url = '/api/channel/tab?id=' + encodeURIComponent(chId) + '&kind=' + kind + (cont ? '&continuation=' + encodeURIComponent(cont) : '');
      var r = await fetch(url); var d = await r.json();
      if (my !== gen) return;
      if (!r.ok) throw new Error(d.error || 'failed');
      var items = d.items || [];
      var grid = $('grid');
      if (!cont && d.sorts && d.sorts.length && kind === 'videos') renderChips(d.sorts);
      var html = items.map(kind === 'shorts' ? shortCard : kind === 'playlists' ? function(i){ return i.type === 'playlist' ? plCard(i) : ''; } : function(i){ return i.type === 'video' ? videoCard(i) : (i.type === 'playlist' ? plCard(i) : ''); }).join('');
      grid.insertAdjacentHTML('beforeend', html);
      cont = d.continuation || '';
      if (!cont) ended = true;
      if (!grid.children.length) setLoading(false, '<div class="empty">' + (kind === 'videos' ? '動画' : kind === 'shorts' ? 'ショート' : kind === 'live' ? 'ライブ配信' : '再生リスト') + 'がありません</div>');
      else setLoading(false, ended ? '' : null);
      if (!ended) { loading = false; setLoading(true); setTimeout(function(){ checkSentinel(); }, 50); return; }
    } catch (e) {
      if (my === gen) { ended = true; setLoading(false, '<div class="empty">読み込みに失敗しました <button class="chip" onclick="retry()">再試行</button></div>'); }
    }
    if (my === gen) loading = false;
  }
  window.retry = function(){ ended = false; loading = false; loadMore(); };

  function renderChips(sorts){
    var c = $('chips');
    c.innerHTML = sorts.map(function(s, i){ return '<button class="chip' + (s.selected ? ' active' : '') + '" data-i="' + i + '">' + esc(s.title) + '</button>'; }).join('');
    c.style.display = 'flex';
    c.querySelectorAll('.chip').forEach(function(el){
      el.onclick = function(){
        var s = sorts[+el.getAttribute('data-i')]; if (!s || el.classList.contains('active')) return;
        c.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('active'); });
        el.classList.add('active');
        gen++; $('grid').innerHTML = ''; ended = false; loading = false; cont = s.token || ''; 
        if (!cont) { selectTab(kind, true); return; }
        loadMore();
      };
    });
  }

  function selectTab(k, force){
    if (k === kind && !force && $('grid').children.length) return;
    kind = k; gen++; cont = ''; ended = false; loading = false;
    $('grid').innerHTML = ''; $('grid').className = 'grid' + (k === 'shorts' ? ' shorts' : '');
    $('chips').style.display = 'none'; $('chips').innerHTML = '';
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t.getAttribute('data-k') === k); });
    loadMore();
  }
  window.selectTab = selectTab;

  function checkSentinel(){
    var s = $('sentinel'); var r = s.getBoundingClientRect();
    if (r.top < window.innerHeight + 600) loadMore();
  }
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function(es){ if (es[0].isIntersecting) loadMore(); }, { rootMargin: '600px' }).observe($('sentinel'));
  }

  /* init */
  function fmtSubs(t){ return t ? ('登録者数 ' + t) : ''; }
  async function init(){
    var d;
    try {
      var r = await fetch('/api/channel/info?' + q);
      d = await r.json();
      if (!r.ok) throw new Error(d.error || 'not found');
    } catch (e) {
      $('cname').textContent = PARAM.charAt(0) === '@' || ID_RE.test(PARAM) ? 'チャンネルが見つかりません' : PARAM;
      setLoading(false, '<div class="empty">チャンネル情報を取得できませんでした。<br><button class="chip" style="margin-top:12px" onclick="location.reload()">再読み込み</button></div>');
      $('avatar').style.display = 'none';
      return;
    }
    info = d; chId = d.id;
    document.title = d.title + ' - YouTube Pro';
    $('cname').textContent = d.title;
    if (d.verified) $('vb').style.display = '';
    if (d.avatar) $('avatar').src = d.avatar; else $('avatar').style.display = 'none';
    if (d.banner) { var b = $('banner'); b.classList.remove('empty'); b.innerHTML = '<img src="' + esc(d.banner) + '" alt="" referrerpolicy="no-referrer">'; }
    $('cmeta').innerHTML = [d.handle ? '<b>' + esc(d.handle) + '</b>' : '', d.subscriberText ? esc(fmtSubs(d.subscriberText)) : '', d.videoCountText ? esc(d.videoCountText) : ''].filter(Boolean).join(' • ');
    var desc = (d.description || '').trim();
    $('cdesc').innerHTML = desc ? esc(desc) + ' <span class="more">...さらに表示</span>' : '';
    if (!desc) $('cdesc').style.display = 'none';
    renderSub();
    var want = [['videos', '動画'], ['shorts', 'ショート'], ['live', 'ライブ'], ['playlists', '再生リスト']];
    var titles = (d.tabs || []).map(function(t){ return t.title; });
    var map = { videos: /^(動画|Videos)$/i, shorts: /^(ショート|Shorts)$/i, live: /^(ライブ|Live)$/i, playlists: /^(再生リスト|Playlists)$/i };
    var tabs = want.filter(function(w){ return titles.some(function(t){ return map[w[0]].test(t); }); });
    if (!tabs.length) tabs = [want[0]];
    $('tabs').innerHTML = tabs.map(function(t){ return '<button class="tab" data-k="' + t[0] + '" onclick="selectTab(\'' + t[0] + '\')">' + t[1] + '</button>'; }).join('');
    selectTab(tabs[0][0], true);
  }
  init();
})();
</script>
</body>
</html>
